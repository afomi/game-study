title: Game Study
tagline: Rebuilding classic games, frame by frame.
series_of: Civic Studio
series_of_url: https://civic.studio
description: >-
  A Civic Studio series. Studies of classic games, one system at a time —
  screenshots, the variables in memory, the code behind each system, and
  small working models that reproduce what the original does.
url: https://games.civic.studio
baseurl: ""

# Snippets are read from disk at build time, never copied:
#   {% snippet lab:models/baseball-stars/pitch.js match:TEXT %}
# Paths are relative to the root named before the colon.
code_roots:
  lab: .
# Snippet captions link to the hosted source.
code_urls:
  lab: https://github.com/afomi/game-study/blob/main

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  games:
    output: true
    permalink: /:name/
  episodes:
    output: true
    permalink: /:path/

defaults:
  - scope: { type: episodes }
    values: { layout: episode }
  - scope: { type: games }
    values: { layout: game }

exclude:
  - tmp        # local ROM collections: never build or publish
  - "*.nes"
  - "*.zip"
  - test
  - bench
  - models      # quoted by snippets; source lives in the repo, not on the site
  - workbench   # ROM-derived; local only, see _config.workbench.yml
  - Gemfile
  - Gemfile.lock
  - README.md
  - PLAN.md
  - package.json
  - package-lock.json
  - node_modules
  - assets/css/tailwind.css   # compiled to main.css by _plugins/tailwind.rb
