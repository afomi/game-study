# Build and deploy Game Study to GitHub Pages (https://afomi.github.io/game-study/).
#
# Self-contained: the site, the models it quotes, and their tests all live in this repo.
# The models' tests and `npm run check` must pass before anything deploys.
# Actions are pinned to commit SHAs (tags noted) per bench/MESENCE-SECURITY.md's advice.
# Never deploys the workbench: it's ROM-derived, local only, and excluded by _config.yml.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up Ruby
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install npm dependencies
        run: npm ci

      - name: Test the models against the bench recordings
        run: npm test

      - name: Check (references, links, CSS, no workbench, fail-loud faults)
        run: bundle exec npm run check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # base_path is "/game-study" while the site lives at afomi.github.io/game-study,
      # and "" if a custom domain is set in the repo's Pages settings later.
      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Verify the build
        run: |
          test -s _site/index.html
          test -s _site/assets/css/main.css
          test ! -e _site/workbench
          test ! -e _site/models
          echo "verified: index, css, no workbench, no model source"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
